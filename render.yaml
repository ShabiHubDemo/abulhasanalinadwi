# Render blueprint: runs the website together with its server, so Admin login,
# User login and the admin dashboard work at a public https address.
#
# Render → New → Blueprint → pick this repository, then fill in ADMIN_EMAIL,
# ADMIN_NAME and ADMIN_PASSWORD when Render asks for them.
#
# FREE PLAN: there is no permanent disk, so the database starts empty after
# every restart or deploy (the free instance also sleeps after ~15 minutes
# idle). Visitor accounts and changes made in the admin panel are lost then;
# the administrator is recreated automatically from the ADMIN_* values.
# For permanent storage switch to `plan: starter` and add a disk:
#   disk: { name: nadwicenter-data, mountPath: /var/data, sizeGB: 1 }
# plus DATABASE_FILE=/var/data/nadwicenter.db.

services:
  - type: web
    name: nadwicenter
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd server && npm run migrate
    startCommand: cd server && npm start
    healthCheckPath: /api/auth/session
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      # entered in the Render dashboard, never stored in the repository
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
