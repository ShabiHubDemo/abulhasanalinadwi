plugins {
    id 'com.android.application'
}

android {
    namespace 'org.abulhasanalinadwi.app'
    compileSdk 34

    defaultConfig {
        applicationId 'org.abulhasanalinadwi.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // the website the app opens
        buildConfigField 'String', 'SITE_URL', '"https://nadwicenter.onrender.com/"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
