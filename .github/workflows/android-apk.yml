# Builds the Nadwi Center Android app (android-app/) and publishes the APK as a
# GitHub Release, so it can be downloaded from:
#   https://github.com/ShabiHubDemo/abulhasanalinadwi/releases/latest/download/nadwi-center.apk
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk nadwi-center.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nadwi-center-apk
          path: nadwi-center.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: Nadwi Center app 1.0 (build ${{ github.run_number }})
          body: |
            Android app for https://nadwicenter.onrender.com

            Download: **nadwi-center.apk** below. On the phone, allow "Install unknown apps" for your browser when asked.
          files: nadwi-center.apk
          make_latest: true
